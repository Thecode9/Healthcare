{% extends 'core/_base.html' %}

{% block header %}
<div class="screen-header" style="justify-content: flex-start;">
    <button class="back-btn" onclick="window.history.back()" style="margin-right: 15px;"><i class="material-icons">arrow_back</i></button>
</div>
{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <h1 style="font-size: 1.8rem; color: var(--text-main); font-weight: 700; margin-bottom: 20px;">Select Your Symptoms</h1>
    
    <div style="position: relative; margin-bottom: 25px;">
        <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">search</i>
        <input type="text" id="symptomSearch" class="form-control" placeholder="Search symptoms..." style="padding-left: 48px; border-radius: 20px;">
    </div>
</div>

<style>
    .symptom-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid #E2E8F0;
        cursor: pointer;
    }
    .symptom-item:last-child {
        border-bottom: none;
    }
    
    .symptom-name {
        font-size: 1rem;
        color: var(--text-main);
        font-weight: 500;
    }
    
    /* Custom Checkbox */
    .custom-checkbox input {
        display: none;
    }
    .checkmark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 2px solid #CBD5E0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .custom-checkbox input:checked + .checkmark {
        background: var(--primary);
        border-color: var(--primary);
    }
    .checkmark::after {
        content: "done";
        font-family: "Material Icons";
        color: white;
        font-size: 16px;
        display: none;
    }
    .custom-checkbox input:checked + .checkmark::after {
        display: block;
    }
</style>

<form method="POST" action="{% url 'symptoms' %}" style="display: flex; flex-direction: column; flex-grow: 1;">
    {% csrf_token %}

    <div id="symptomsList" style="flex-grow: 1; overflow-y: auto; margin-bottom: 30px;">
        {% for symp in symptoms %}
        <label class="symptom-item">
            <span class="symptom-name">{{ symp }}</span>
            <div class="custom-checkbox">
                <input type="checkbox" name="symptoms" value="{{ symp }}">
                <div class="checkmark"></div>
            </div>
        </label>
        {% endfor %}
    </div>

    <button type="submit" class="btn btn-primary" style="background: var(--primary-gradient); border: none; display: flex; align-items: center; justify-content: center; gap: 10px;">
        Predict <i class="material-icons" style="font-size: 20px;">arrow_forward</i>
    </button>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('symptomSearch');
        const symptomItems = document.querySelectorAll('.symptom-item');

        searchInput.addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            symptomItems.forEach(item => {
                const name = item.querySelector('.symptom-name').textContent.toLowerCase();
                if (name.includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
{% endblock %}
