{% extends 'core/_base.html' %}

{% block header %}
<div class="screen-header" style="justify-content: flex-start;">
    <button class="back-btn" onclick="window.history.back()" style="margin-right: 15px;"><i class="material-icons">arrow_back</i></button>
</div>
{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <h1 style="font-size: 1.8rem; color: var(--text-main); font-weight: 700; margin-bottom: 20px;">Select Your Symptoms</h1>
    
    <div style="position: relative; margin-bottom: 25px;">
        <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">search</i>
        <input type="text" id="symptomSearch" class="form-control" placeholder="Search symptoms..." style="padding-left: 48px; border-radius: 20px;">
    </div>
</div>

<style>
    .symptom-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid #E2E8F0;
        cursor: pointer;
    }
    .symptom-item:last-child {
        border-bottom: none;
    }
    
    .symptom-name {
        font-size: 1rem;
        color: var(--text-main);
        font-weight: 500;
        text-transform: capitalize;
    }
    
    .sticky-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg, #fff);
        padding: 12px 16px;
        display: flex;
        justify-content: center;
        box-shadow: 0 -6px 22px rgba(0,0,0,0.06);
        z-index: 9999;
    }

    /* Custom Checkbox */
    .custom-checkbox input {
        display: none;
    }
    .checkmark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 2px solid #CBD5E0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .custom-checkbox input:checked + .checkmark {
        background: var(--primary);
        border-color: var(--primary);
    }
    .checkmark::after {
        content: "done";
        font-family: "Material Icons";
        color: white;
        font-size: 16px;
        display: none;
    }
    .custom-checkbox input:checked + .checkmark::after {
        display: block;
    }
</style>

<form method="POST" action="{% url 'symptoms' %}" style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">
    {% csrf_token %}

    <div id="symptomsList" style="flex-grow: 1; overflow-y: auto; margin-bottom: 16px; padding-bottom: 120px; max-height: calc(100vh - 220px);">
        {% for symp in symptoms %}
        <label class="symptom-item">
            <span class="symptom-name">{{ symp.label }}</span>
            <div class="custom-checkbox">
                <input type="checkbox" name="symptoms" value="{{ symp.key }}">
                <div class="checkmark"></div>
            </div>
        </label>
        {% endfor %}
    </div>

    <div class="sticky-footer">
        <button type="submit" class="btn btn-primary" style="background: var(--primary-gradient); border: none; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 420px; padding: 16px;">
            Predict <i class="material-icons" style="font-size: 20px;">arrow_forward</i>
        </button>
    </div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('symptomSearch');
        const container = document.getElementById('symptomsList');
        const form = document.getElementById('symptomForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const submitBtn = document.getElementById('submitBtn');

        // Live search
        searchInput.addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            container.querySelectorAll('.symptom-item').forEach(item => {
                const name = item.querySelector('.symptom-name').textContent.toLowerCase();
                item.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        // Move checked to top
        container.addEventListener('change', function(e) {
            const input = e.target;
            if (!input.matches('input[type="checkbox"]')) return;
            const label = input.closest('.symptom-item');
            if (!label) return;
            if (input.checked) {
                container.prepend(label);
            } else {
                const checkedInputs = container.querySelectorAll('input[type="checkbox"]:checked');
                if (checkedInputs.length === 0) {
                    container.append(label);
                } else {
                    checkedInputs[checkedInputs.length - 1].closest('.symptom-item').after(label);
                }
            }
        });

        // Loading spinner on submit
        form.addEventListener('submit', function(e) {
            const checked = container.querySelectorAll('input[type="checkbox"]:checked');
            if (checked.length === 0) {
                e.preventDefault();
                alert('Please select at least one symptom before predicting.');
                return;
            }
            loadingOverlay.style.display = 'flex';
            submitBtn.disabled = true;
        });
    });
</script>

<!-- Loading Overlay -->
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
     background:rgba(26,16,64,0.85); backdrop-filter:blur(8px);
     z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:20px;">
    <div style="width:64px; height:64px; border-radius:50%;
                border:5px solid rgba(255,255,255,0.15);
                border-top-color:#4A24E1;
                animation: spin 0.9s linear infinite;"></div>
    <div style="color:white; font-size:1rem; font-weight:600;">Analysing symptoms with AI...</div>
    <div style="color:rgba(255,255,255,0.6); font-size:0.82rem;">This usually takes 1–2 seconds</div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</div>

{% endblock %}
