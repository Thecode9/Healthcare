{% extends 'core/_base.html' %}

{% block header %}
<div class="screen-header" style="justify-content: flex-start; padding-bottom: 0;">
    <!-- No back button, they must complete onboarding -->
</div>
{% endblock %}

{% block content %}
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 10px;">
    <h1 style="font-size: 2rem; margin-bottom: 8px; color: var(--text-main); font-weight: 700;">Complete Profile</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 1rem;">Let's get to know you better</p>

    <form method="POST" action="{% url 'onboarding' %}">
        {% csrf_token %}
        
        <div class="form-group" style="position: relative;">
            <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">person</i>
            <input type="text" name="full_name" class="form-control" placeholder="Full Name" required style="padding-left: 48px;">
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="position: relative; flex: 1;">
                <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">cake</i>
                <input type="number" name="age" class="form-control" placeholder="Age" required style="padding-left: 48px;">
            </div>
            
            <div class="form-group" style="position: relative; flex: 1;">
                <select name="gender" class="form-control" required style="appearance: none; padding-left: 48px; background: white;">
                    <option value="" disabled selected>Sex</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="O">Other</option>
                </select>
                <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">wc</i>
                <i class="material-icons" style="position: absolute; right: 16px; top: 16px; color: var(--text-muted); pointer-events: none;">expand_more</i>
            </div>
        </div>

        <div class="form-group" style="position: relative; margin-bottom: 25px;">
            <select name="blood_type" class="form-control" style="appearance: none; padding-left: 48px; background: white;">
                <option value="" disabled selected>Blood Type (Optional)</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">water_drop</i>
            <i class="material-icons" style="position: absolute; right: 16px; top: 16px; color: var(--text-muted); pointer-events: none;">expand_more</i>
        </div>

        <div class="form-group" style="background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid #E2E8F0; display: flex; align-items: center; margin-bottom: 15px;">
            <input type="checkbox" name="actively_on_medication" id="on_meds" style="margin-right: 15px; transform: scale(1.3);">
            <label for="on_meds" style="margin: 0; color: var(--text-main); font-weight: 500;">Actively on medication?</label>
        </div>

        <div class="form-group" id="meds_box" style="display: none;">
            <textarea name="current_medications" class="form-control" placeholder="List current medications..." rows="3"></textarea>
        </div>

        <div class="form-group" style="margin-bottom: 30px;">
            <textarea name="allergies" class="form-control" placeholder="Any known allergies? (Optional)" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="background: var(--primary-gradient); border: none;">Finish Setup</button>
    </form>
</div>

<script>
    document.getElementById('on_meds').addEventListener('change', function() {
        document.getElementById('meds_box').style.display = this.checked ? 'block' : 'none';
    });
</script>
{% endblock %}
