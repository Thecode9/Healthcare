<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007BFF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SmartHealth+">
    {% load static %}
    <link rel="manifest" href="{% static 'core/manifest.json' %}">
    <title>SmartHealth+</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #007BFF;
            --primary-light: #E6F2FF;
            --secondary: #20B2AA;
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --danger: #E53E3E;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            background: var(--bg-color);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation / Header */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .header-link {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }

        /* Main Content Area */
        .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--surface);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(0, 123, 255, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        /* Alerts / Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-error {
            background-color: #FED7D7;
            color: #C53030;
        }

        .alert-success {
            background-color: #C6F6D5;
            color: #2F855A;
        }

        .alert-info {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dashboard Specifics */
        .user-greeting {
            margin-bottom: 30px;
        }

        .user-greeting h1 {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .user-greeting p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .pill-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .pill-card:active {
            transform: scale(0.97);
        }

        .pill-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .pill-icon.blue {
            background: var(--primary-light);
            color: var(--primary);
        }

        .pill-icon.green {
            background: #E6FFFA;
            color: var(--secondary);
        }

        .pill-icon.gray {
            background: #EDF2F7;
            color: var(--text-muted);
        }

        .pill-content h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .pill-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .floating-action {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="header">
            <a href="{% url 'home' %}" class="header-title">SmartHealth+</a>
            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="header-link">Logout</a>
            {% endif %}
        </header>

        <main class="content">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
