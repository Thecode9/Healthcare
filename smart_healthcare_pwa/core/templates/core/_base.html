<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007BFF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MedAI">
    {% load static %}
    <link rel="manifest" href="{% static 'core/manifest.json' %}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>MedAI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #4A24E1; /* Deep Purple */
            --primary-gradient: linear-gradient(135deg, #4A24E1 0%, #2A8BF2 100%);
            --primary-light: #E8E5F6;
            --secondary: #2A8BF2; /* Blue */
            --secondary-gradient: linear-gradient(135deg, #2A8BF2 0%, #17C6ED 100%);
            --success: #1FC96E; /* Green */
            --success-gradient: linear-gradient(135deg, #1FC96E 0%, #0AA856 100%);
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #8E8E93;
            --danger: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(74, 36, 225, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            background: var(--bg-color);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Space for bottom nav */
        }

        /* Top Header specific to screens */
        .screen-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
        }
        .screen-header .back-btn, .screen-header .menu-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            color: var(--text-main);
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
            transition: transform 0.2s, color 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--primary);
        }
        .nav-item:hover i, .nav-item.active i {
            transform: translateY(-2px);
            color: var(--primary);
        }

        /* Main Content Area */
        .content {
            padding: 0 24px 24px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--surface);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            color: var(--text-main);
            border: 1px solid #E2E8F0;
        }

        /* Alerts / Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-error {
            background-color: #FED7D7;
            color: #C53030;
        }

        .alert-success {
            background-color: #C6F6D5;
            color: #2F855A;
        }

        .alert-info {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dashboard Specifics */
        .user-greeting {
            margin-bottom: 30px;
        }

        .user-greeting h1 {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .user-greeting p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .pill-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .pill-card:active {
            transform: scale(0.97);
        }

        .pill-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .pill-icon.blue {
            background: var(--primary-light);
            color: var(--primary);
        }

        .pill-icon.green {
            background: #E6FFFA;
            color: var(--secondary);
        }

        .pill-icon.gray {
            background: #EDF2F7;
            color: var(--text-muted);
        }

        .pill-content h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .pill-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .floating-action {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="app-container">
        {% block header %}
        {% endblock %}

        <main class="content">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </main>

        {% if user.is_authenticated %}
        <nav class="bottom-nav">
            <a href="{% url 'dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="material-icons">home</i>
                <span>Home</span>
            </a>
            <a href="{% url 'history' %}" class="nav-item {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
                <i class="material-icons">history</i>
                <span>History</span>
            </a>
            <a href="{% url 'book_appointment' %}" class="nav-item {% if request.resolver_match.url_name == 'book_appointment' %}active{% endif %}">
                <i class="material-icons">calendar_today</i>
                <span>Appointments</span>
            </a>
            <a href="{% url 'logout' %}" class="nav-item">
                <i class="material-icons">person</i>
                <span>Profile</span>
            </a>
        </nav>
        {% endif %}
    </div>
</body>

</html>
