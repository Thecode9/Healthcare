{% extends 'core/_base.html' %}

{% block content %}
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
    <h1 style="font-size: 2rem; margin-bottom: 10px; text-align: center;">Welcome Back</h1>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Sign in to manage your health</p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" class="form-control" id="id_username" required>
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Login</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </div>
</div>
{% endblock %}
