{% extends 'core/_base.html' %}

{% block header %}
<div class="screen-header" style="justify-content: flex-start; padding-bottom: 0;">
    <button class="back-btn" onclick="window.history.back()"><i class="material-icons">arrow_back</i></button>
</div>
{% endblock %}

{% block content %}
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 20px;">
    <h1 style="font-size: 2rem; margin-bottom: 8px; color: var(--text-main); font-weight: 700;">Welcome Back! 👋</h1>
    <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 1rem;">Login to your account</p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group" style="position: relative;">
            <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">person_outline</i>
            <input type="text" name="username" class="form-control" id="id_username" placeholder="Username / Email" required style="padding-left: 48px;">
        </div>
        <div class="form-group" style="position: relative; margin-bottom: 10px;">
            <i class="material-icons" style="position: absolute; left: 16px; top: 16px; color: var(--text-muted);">lock_outline</i>
            <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required style="padding-left: 48px;">
            <i class="material-icons" style="position: absolute; right: 16px; top: 16px; color: var(--text-muted); cursor: pointer;">visibility_off</i>
        </div>

        <div style="text-align: right; margin-bottom: 30px;">
            <a href="#" style="color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="background: var(--primary-gradient); border: none;">Login</button>
    </form>

    <div style="text-align: center; margin: 30px 0; position: relative;">
        <hr style="border: 0; border-top: 1px solid #E2E8F0;">
        <span style="background: var(--bg-color); padding: 0 10px; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: var(--text-muted); font-size: 0.85rem;">or continue with</span>
    </div>

    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
        <button style="width: 60px; height: 60px; border-radius: 16px; border: 1px solid #E2E8F0; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <!-- Mock Google Icon using text for now, could be replaced with SVG -->
            <span style="font-weight: 700; color: #DB4437; font-size: 24px;">G</span>
        </button>
        <button style="width: 60px; height: 60px; border-radius: 16px; border: 1px solid #E2E8F0; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <i class="material-icons" style="font-size: 28px; color: #000;">apple</i>
        </button>
    </div>

    <div class="auth-footer" style="margin-top: auto; padding-bottom: 20px;">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary);">Sign up</a>
    </div>
</div>
{% endblock %}
